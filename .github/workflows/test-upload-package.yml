name: Test upload-package action

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build test package
    runs-on: self-hosted-amd64-medium-privileged-on-demand
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          pixi-version: v0.67.0
          manifest-path: upload-package/tests/pixi.toml

      - name: Build test conda package
        working-directory: upload-package/tests
        run: |
          pixi run rattler-build build \
            --recipe test-package/recipe.yaml \
            --output-dir ../build

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-conda-package
          path: ./upload-package/build/noarch/*.conda
          if-no-files-found: error

  test-anaconda-org:
    name: Test anaconda.org upload
    needs: build-test-package
    runs-on: self-hosted-amd64-medium-privileged-on-demand
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download test package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-conda-package
          path: ./packages

      - name: Upload to anaconda.org
        uses: ./upload-package
        with:
          token: ${{ secrets.ANACONDA_ORG_TEST_TOKEN }}
          owner: anaconda-cloud
          packages: ./packages/*.conda
          private: true
          labels: "main,dev"
          verbose: true

  test-repository:
    name: Test repository upload
    needs: build-test-package
    runs-on: self-hosted-amd64-medium-privileged-on-demand
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download test package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-conda-package
          path: ./packages

      - name: Upload to repository
        uses: ./upload-package
        with:
          token: ${{ secrets.PSM_PKGS_INTERNAL_TEST_TOKEN }}
          owner: anaconda-github-actions-test
          packages: ./packages/*.conda
          target-type: repository
          repository-url: ${{ vars.PSM_PKGS_INTERNAL_TEST_URL }}
          package-type: conda
          verbose: true

  test-self-hosted:
    name: Test self-hosted upload
    needs: build-test-package
    runs-on: self-hosted-amd64-medium-privileged-on-demand
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download test package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-conda-package
          path: ./packages

      - name: Upload to self-hosted
        uses: ./upload-package
        with:
          token: ${{ secrets.AP_STAGING_API_KEY }}
          owner: anaconda-github-actions-test
          packages: ./packages/*.conda
          target-type: self-hosted
          repository-url: ${{ vars.AP_STAGING_URL }}
          package-type: conda
          verbose: true

  check:
    name: Check
    if: always()
    needs:
      [build-test-package, test-anaconda-org, test-repository, test-self-hosted]
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether all jobs succeeded
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
