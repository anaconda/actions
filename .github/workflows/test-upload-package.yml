name: Test upload-package action

on:
  pull_request:
    paths:
      - "upload-package/**"
      - ".github/workflows/test-upload-package.yml"
      - "tests/**"

jobs:
  build-test-package:
    name: Build test package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          channels: defaults
          auto-activate-base: true

      - name: Build test conda package
        shell: bash -el {0}
        run: |
          conda install -y conda-build
          conda build tests/test-package/recipe --output-folder ./build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-conda-package
          path: ./build/noarch/*.conda
          if-no-files-found: error

  test-anaconda-org:
    name: Test anaconda.org upload
    needs: build-test-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download test package
        uses: actions/download-artifact@v4
        with:
          name: test-conda-package
          path: ./packages

      - name: Upload to anaconda.org
        uses: ./upload-package
        with:
          token: ${{ secrets.ANACONDA_ORG_TEST_TOKEN }}
          owner: anaconda-github-actions-test
          packages: ./packages/*.conda
          force: true

  test-repository:
    name: Test repository upload
    needs: build-test-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download test package
        uses: actions/download-artifact@v4
        with:
          name: test-conda-package
          path: ./packages

      - name: Upload to repository
        uses: ./upload-package
        with:
          token: ${{ secrets.PSM_TEST_TOKEN }}
          owner: github-actions-test
          packages: ./packages/*.conda
          target-type: repository
          repository-url: ${{ vars.PSM_TEST_URL }}
          package-type: conda
          force: true
