name: Test upload-package action

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build test package
    runs-on: self-hosted-amd64-medium-privileged-on-demand
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.80.0
          manifest-path: upload-package/tests/pixi.toml

      - name: Build test conda package
        working-directory: upload-package/tests
        env:
          CONDA_PACKAGE_SUFFIX: ""
        run: |
          pixi run rattler-build build \
            --recipe test-package/recipe.yaml \
            --output-dir ../build

      - name: Build test conda package (alternate name)
        working-directory: upload-package/tests
        env:
          CONDA_PACKAGE_SUFFIX: "-alt"
        run: |
          pixi run rattler-build build \
            --recipe test-package/recipe.yaml \
            --output-dir ../build-alt

      - name: Upload build artifact (build 0)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-conda-package
          path: ./upload-package/build/noarch/*.conda
          if-no-files-found: error

      - name: Upload build artifact (build 1)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-conda-package-alt
          path: ./upload-package/build-alt/noarch/*.conda
          if-no-files-found: error

  test-anaconda-org:
    name: Test anaconda.org upload
    needs: build-test-package
    runs-on: self-hosted-amd64-medium-privileged-on-demand
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download test package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-conda-package
          path: ./packages

      - name: Upload to anaconda.org
        uses: ./upload-package
        with:
          token: ${{ secrets.ANACONDA_ORG_TEST_TOKEN }}
          channel: anaconda-cloud
          packages: ./packages/*.conda
          private: true
          labels: "main,dev"
          verbose: true

      - name: Verify package was uploaded
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_ORG_TEST_TOKEN }}
          ANACONDA_CLIENT_FORCE_STANDALONE: "1"
        run: |
          # Store token using anaconda-client's storage mechanism
          ~/.ana/tools/anaconda-cli/bin/python -c "
          import os
          from binstar_client.utils.config import store_token
          store_token(os.environ['ANACONDA_API_TOKEN'], None)
          "
          conda config --set add_anaconda_token true
          conda search -c anaconda-cloud github-actions-test-package=0.0.${{ github.run_number }}

  test-psm:
    name: Test PSM upload
    needs: build-test-package
    runs-on: self-hosted-amd64-medium-privileged-on-demand
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download test package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-conda-package
          path: ./packages

      - name: Upload to PSM
        uses: ./upload-package
        with:
          token: ${{ secrets.PSM_PKGS_INTERNAL_TEST_TOKEN }}
          channel: anaconda-github-actions-test
          packages: ./packages/*.conda
          target-type: psm
          repository-url: ${{ vars.PSM_PKGS_INTERNAL_TEST_URL }}
          package-type: conda
          verbose: true

  test-double-invocation:
    name: Test double invocation in one job
    needs: build-test-package
    runs-on: self-hosted-amd64-medium-privileged-on-demand
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download test package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-conda-package-alt
          path: ./packages

      - name: First upload (anaconda.org)
        uses: ./upload-package
        with:
          token: ${{ secrets.ANACONDA_ORG_TEST_TOKEN }}
          channel: anaconda-cloud
          packages: ./packages/*.conda
          private: true
          labels: "main,dev"
          force: true
          verbose: true

      - name: Second upload (PSM) — must not fail on pixi re-install
        uses: ./upload-package
        with:
          token: ${{ secrets.PSM_PKGS_INTERNAL_TEST_TOKEN }}
          channel: anaconda-github-actions-test
          packages: ./packages/*.conda
          target-type: psm
          repository-url: ${{ vars.PSM_PKGS_INTERNAL_TEST_URL }}
          package-type: conda
          verbose: true

  check:
    name: Check
    if: always()
    needs:
      [
        build-test-package,
        test-anaconda-org,
        test-psm,
        test-double-invocation,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether all jobs succeeded
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
