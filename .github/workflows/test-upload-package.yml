name: Test upload-package action

on:
  pull_request:
    paths:
      - "upload-package/**"
      - ".github/workflows/test-upload-package.yml"
      - "tests/**"
  merge_group:

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build test package
    runs-on: self-hosted-amd64-medium-privileged-on-demand
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          pixi-version: v0.47.0
          manifest-path: tests/pixi.toml

      - name: Build test conda package
        working-directory: tests
        run: |
          pixi run rattler-build build \
            --recipe test-package/recipe.yaml \
            --output-dir ../build

      - name: Upload build artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: test-conda-package
          path: ./build/noarch/*.conda
          if-no-files-found: error

  test-anaconda-org:
    name: Test anaconda.org upload
    needs: build-test-package
    runs-on: self-hosted-amd64-medium-privileged-on-demand
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download test package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-conda-package
          path: ./packages

      - name: Upload to anaconda.org
        uses: ./upload-package
        with:
          token: ${{ secrets.ANACONDA_ORG_TEST_TOKEN }}
          owner: anaconda-cloud
          packages: ./packages/*.conda
          private: true

  test-repository:
    name: Test repository upload
    needs: build-test-package
    runs-on: self-hosted-amd64-medium-privileged-on-demand
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download test package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-conda-package
          path: ./packages

      - name: Upload to repository
        uses: ./upload-package
        with:
          token: ${{ secrets.PSM_PKGS_INTERNAL_TEST_TOKEN }}
          owner: anaconda-github-actions-test
          packages: ./packages/*.conda
          target-type: repository
          repository-url: ${{ vars.PSM_PKGS_INTERNAL_TEST_URL }}
          package-type: conda

  check:
    name: Check
    if: always()
    needs: [build-test-package, test-anaconda-org, test-repository]
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether all jobs succeeded
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
