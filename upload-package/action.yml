name: "Upload Package"
description: "Upload conda or Python packages to Anaconda.org, Anaconda Repository (PSM), or self-hosted Anaconda Platform"
author: "Anaconda"

inputs:
  token:
    description: "API token for authentication"
    required: true
  packages:
    description: "Path or glob pattern to package files (e.g., ./build/noarch/*.conda or ./dist/*.whl)"
    required: true
  owner:
    description: "Package owner/channel (e.g., organization name or channel)"
    required: true
  target-type:
    description: 'Upload target type: "anaconda.org", "repository" (for PSM/Anaconda Business), or "self-hosted" (for self-hosted Anaconda Platform)'
    required: false
    default: "anaconda.org"
  repository-url:
    description: 'URL of the repository API (required when target-type is "repository" or "self-hosted")'
    required: false
  package-type:
    description: 'Type of package: "conda" or "pypi" (auto-detected from file extension if not specified)'
    required: false
  summary:
    description: "Package summary (anaconda.org only)"
    required: false
  private:
    description: "Make package private (anaconda.org only)"
    required: false
    default: "false"
  labels:
    description: "Comma-separated list of labels to apply to the package (anaconda.org only, e.g., 'main,dev')"
    required: false
  force:
    description: "Overwrite existing packages if they already exist"
    required: false
    default: "false"
  verbose:
    description: "Enable verbose output"
    required: false
    default: "false"
  disable-new-cli:
    description: "Disable new anaconda-client CLI parser (anaconda.org only)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      env:
        INPUT_TARGET_TYPE: ${{ inputs.target-type }}
        INPUT_REPOSITORY_URL: ${{ inputs.repository-url }}
      run: |
        if [ "$INPUT_TARGET_TYPE" = "repository" ] && [ -z "$INPUT_REPOSITORY_URL" ]; then
          echo "::error::repository-url is required when target-type is 'repository'"
          exit 1
        fi

        if [ "$INPUT_TARGET_TYPE" = "self-hosted" ] && [ -z "$INPUT_REPOSITORY_URL" ]; then
          echo "::error::repository-url is required when target-type is 'self-hosted'"
          exit 1
        fi

    - name: Setup pixi
      uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
      with:
        pixi-version: v0.67.2
        manifest-path: ${{ github.action_path }}/pixi.toml

    - name: Upload to anaconda.org
      if: inputs.target-type == 'anaconda.org'
      shell: bash
      env:
        ANACONDA_API_TOKEN: ${{ inputs.token }}
        ANACONDA_CLI_FORCE_NEW: ${{ inputs.disable-new-cli != 'true' && '1' || '' }}
        PIXI_PROJECT_MANIFEST: ${{ github.action_path }}/pixi.toml
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_PRIVATE: ${{ inputs.private }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_PACKAGE_TYPE: ${{ inputs.package-type }}
        INPUT_LABELS: ${{ inputs.labels }}
        INPUT_OWNER: ${{ inputs.owner }}
        INPUT_PACKAGES: ${{ inputs.packages }}
      run: |
        GLOBAL_FLAGS=""
        FLAGS=""

        if [ "$INPUT_VERBOSE" = "true" ]; then
          GLOBAL_FLAGS="$GLOBAL_FLAGS --verbose"
        fi

        if [ "$INPUT_FORCE" = "true" ]; then
          FLAGS="$FLAGS --force"
        fi

        if [ "$INPUT_PRIVATE" = "true" ]; then
          FLAGS="$FLAGS --private"
        fi

        if [ -n "$INPUT_SUMMARY" ]; then
          FLAGS="$FLAGS --summary \"$INPUT_SUMMARY\""
        fi

        if [ -n "$INPUT_PACKAGE_TYPE" ]; then
          FLAGS="$FLAGS --package-type $INPUT_PACKAGE_TYPE"
        fi

        if [ -n "$INPUT_LABELS" ]; then
          IFS=',' read -ra LABELS <<< "$INPUT_LABELS"
          for label in "${LABELS[@]}"; do
            FLAGS="$FLAGS --label $(echo "$label" | xargs)"
          done
        fi

        # Show help for debugging purposes
        pixi run anaconda org upload --help

        pixi run anaconda \
          $GLOBAL_FLAGS \
          --token "$ANACONDA_API_TOKEN" \
          upload \
          --user "$INPUT_OWNER" \
          $FLAGS \
          $INPUT_PACKAGES

    - name: Upload to repository
      if: inputs.target-type == 'repository'
      shell: bash
      env:
        UPLOAD_TOKEN: ${{ inputs.token }}
        PIXI_PROJECT_MANIFEST: ${{ github.action_path }}/pixi.toml
        INPUT_REPOSITORY_URL: ${{ inputs.repository-url }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_PACKAGE_TYPE: ${{ inputs.package-type }}
        INPUT_OWNER: ${{ inputs.owner }}
        INPUT_PACKAGES: ${{ inputs.packages }}
      run: |
        pixi run conda repo config --set sites.upload_target.url "$INPUT_REPOSITORY_URL"

        GLOBAL_FLAGS=""
        FLAGS=""

        if [ "$INPUT_VERBOSE" = "true" ]; then
          GLOBAL_FLAGS="$GLOBAL_FLAGS --verbose"
        fi

        if [ -n "$INPUT_PACKAGE_TYPE" ]; then
          FLAGS="$FLAGS --package-type $INPUT_PACKAGE_TYPE"
        fi

        pixi run conda repo \
          $GLOBAL_FLAGS \
          --token "$UPLOAD_TOKEN" \
          --site upload_target \
          upload \
          --channel "$INPUT_OWNER" \
          $FLAGS \
          $INPUT_PACKAGES

    - name: Upload to self-hosted
      if: inputs.target-type == 'self-hosted'
      shell: bash
      env:
        ANACONDA_AUTH_API_KEY: ${{ inputs.token }}
        PIXI_PROJECT_MANIFEST: ${{ github.action_path }}/pixi.toml
        INPUT_REPOSITORY_URL: ${{ inputs.repository-url }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_PACKAGE_TYPE: ${{ inputs.package-type }}
        INPUT_OWNER: ${{ inputs.owner }}
        INPUT_PACKAGES: ${{ inputs.packages }}
      run: |
        pixi run -e self-hosted anaconda sites add --default --domain "$INPUT_REPOSITORY_URL" --yes

        GLOBAL_FLAGS=""
        FLAGS=""

        if [ "$INPUT_VERBOSE" = "true" ]; then
          GLOBAL_FLAGS="$GLOBAL_FLAGS --verbose"
        fi

        if [ -n "$INPUT_PACKAGE_TYPE" ]; then
          FLAGS="$FLAGS --package-type $INPUT_PACKAGE_TYPE"
        fi

        pixi run -e self-hosted anaconda \
          $GLOBAL_FLAGS \
          repo upload \
          --channel "$INPUT_OWNER" \
          $FLAGS \
          $INPUT_PACKAGES
